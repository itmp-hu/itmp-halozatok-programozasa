---- name: Create /tmp/exists directory if user "cisco" exists  hosts: all  become: yes  tasks:    - name: Check if user "cisco" exists      command: id cisco      register: user_check      ignore_errors: true		# akkor is folytatja, ha hiba van    - name: Create /tmp/exists directory if user "cisco" exists      file:        path: /tmp/exists        state: directory      when: user_check.rc == 0	# rc: return code