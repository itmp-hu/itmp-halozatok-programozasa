---- name: Dolgozatok beszedese  hosts: linux  become: yes  tasks:    - name: .bash_history bemasolasa      copy:        src: /home/gt/.bash_history        remote_src: true        dest: /home/gt/DOGA2/history    - name: Dolgozat konyvtar osszetomoritese      command: "tar zcvf /home/gt/doga2.tgz /home/gt/DOGA2/"    - name: Begyujtes a tanari gepre      fetch:        src: /home/gt/doga2.tgz        dest: /tmp/fetched/doga2-{{ ansible_hostname }}.tgz        flat: true